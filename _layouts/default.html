<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">

	{% seo %}

	<link href="/css/custom.css" rel="stylesheet">

	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="manifest" href="/site.webmanifest">
	<meta name="theme-color" content="#0d0f0d">
</head>
<body{% if page.layout == "post" %} class="post-page"{% endif %}>
	<div class="container-narrow">
		<header class="masthead">
			<a class="brand" href="/"><span class="brand-word">brain first</span><span class="caret"></span></a>
			<nav class="nav">
				<a href="/"{% if page.url == "/" %} class="active"{% endif %}><span class="label">home</span></a>
				<a href="/blog"{% if page.url == "/blog" or page.path contains '_posts' %} class="active"{% endif %}><span class="label">blog</span></a>
				<a href="/about"{% if page.url == "/about" %} class="active"{% endif %}><span class="label">about</span></a>
			</nav>
		</header>

		<main>
			{{ content }}
		</main>

		<footer class="footer">
			<span class="prompt">$</span> &copy; 2026 Alexander Ivanov &middot; built with <a href="https://jekyllrb.com" rel="nofollow">Jekyll</a>
		</footer>
	</div>
	<script>
	(function () {
		// Keep every phrase at 11 characters or fewer so the brand and nav share one line on phones.
		var phrases = [
			"brain first", "think first", "ask better", "know why", "know limits",
			"understand", "no magic", "be curious", "read code", "doubt it",
			"test first", "slow down", "in the loop", "own it", "mind gaps",
			"guard data", "debug self", "prompt well", "verify", "just a tool",
			"learn daily", "stay sharp", "think slow", "ask why", "human first",
			"encrypt it", "curate it", "measure it", "design well", "name things",
			"refactor", "remember", "small steps", "simplify", "stay awake",
			"trust less", "mind risks", "share how", "question it", "stay human"
		];
		var el = document.querySelector(".brand-word");
		if (!el) return;
		var pick = function (not) {
			var p; do { p = phrases[Math.floor(Math.random() * phrases.length)]; } while (p === not);
			return p;
		};
		var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
		var current = pick(el.textContent);
		el.textContent = current;
		if (reduced) return;
		var HOLD = 8000, ERASE = 45, TYPE = 75;
		var erase = function (next) {
			if (el.textContent.length) {
				el.textContent = el.textContent.slice(0, -1);
				setTimeout(function () { erase(next); }, ERASE);
			} else {
				type(next, 0);
			}
		};
		var type = function (word, i) {
			if (i <= word.length) {
				el.textContent = word.slice(0, i);
				setTimeout(function () { type(word, i + 1); }, TYPE);
			} else {
				current = word;
				setTimeout(cycle, HOLD);
			}
		};
		var cycle = function () {
			if (document.hidden) { setTimeout(cycle, HOLD); return; }
			erase(pick(current));
		};
		setTimeout(cycle, HOLD);
	})();
	</script>
</body>
</html>
